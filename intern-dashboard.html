<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        if (/Mobi|Android|iPhone|iPad|Tablet|iPod/i.test(navigator.userAgent)) {
            document.documentElement.classList.add('mobile-device');
        }
    </script>
    <title>Skyars — Intern Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Mobile Blocker Screen -->
    <div id="mobile-blocker-screen">
        <div class="icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        </div>
        <h1>PC / Desktop Only</h1>
        <p>Aap is portal ko mobile ya tablet par open nahi kar sakte. Kripya access karne ke liye apne laptop ya computer ka use karein.</p>
    </div>

    <div class="erp-layout">
        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar">
            <div class="sidebar-logo" style="display: flex; align-items: center; justify-content: center; height: 60px; padding: 0 16px;">
                <img src="logo.png" alt="Skyars Logo" style="max-width: 140px; max-height: 38px; object-fit: contain;">
            </div>

            <div class="sidebar-section-label">Workspace</div>

            <nav class="sidebar-nav">
                <!-- SPA Links: 'data-route' points to the partial file in views folder -->
                <a class="nav-item active" href="#" data-route="views/intern/overview.html" data-title="My Dashboard">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    My Dashboard
                </a>
                <a class="nav-item" href="#" data-route="views/intern/tasks.html" data-title="My Tasks">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                    My Tasks
                </a>
                <a class="nav-item" href="#" data-route="views/intern/attendance.html" data-title="Attendance">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    Attendance
                </a>
            </nav>

            <!-- Sidebar Footer -->
            <div class="sidebar-footer">
                <div class="user-chip">
                    <div class="user-avatar" id="intern-avatar">I</div>
                    <div class="user-info">
                        <div class="user-name" id="intern-name">Intern</div>
                        <div class="user-role">Intern</div>
                    </div>
                    <button class="logout-btn" id="logout-btn" title="Logout">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                </div>
            </div>
        </aside>

        <!-- ===== MAIN CONTENT ===== -->
        <div class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <h1 class="page-title" id="page-title">My Dashboard</h1>
                    <span id="today-date" style="font-size:12px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;"></span>
                </div>
                <div class="topbar-right">
                    <button class="icon-btn" title="Notifications">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    </button>
                </div>
            </header>

            <!-- THIS IS WHERE ROUTER.JS WILL INJECT THE VIEWS -->
            <main class="page-body" id="app-content">
                <div class="loader-ring" style="margin: 40px auto;"></div>
            </main>

        </div>
    </div>

    <!-- ===== MODALS ===== -->
    <!-- Submit DSR Modal -->
    <div class="modal-overlay" id="submit-dsr-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Submit Daily Status Report (DSR)</h3>
                <button class="modal-close" onclick="closeModal('submit-dsr-modal')">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <form id="submit-dsr-form">
                <div class="form-group">
                    <label class="form-label" for="dsr-task-select">Select Task</label>
                    <select id="dsr-task-select" class="form-input" required>
                        <option value="">Select task...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="dsr-content-input">What did you accomplish today?</label>
                    <textarea id="dsr-content-input" class="form-input" style="resize:vertical;min-height:100px;" placeholder="Implemented authentication flow, fixed sidebar routing issues..." required></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label" for="dsr-hours-input">Hours Spent</label>
                    <input type="number" id="dsr-hours-input" class="form-input" min="0.5" max="24" step="0.5" placeholder="e.g. 4.5" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="dsr-status-select">Update Task Status</label>
                    <select id="dsr-status-select" class="form-input" required>
                        <option value="In Progress">In Progress</option>
                        <option value="Done">Done</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('submit-dsr-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="submit-dsr-submit">Submit DSR</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/supabase-config.js"></script>
    <script src="js/router.js"></script>
    <script src="js/intern-app.js"></script>
</body>
</html>
